plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def local = new Properties()
def propertiesFile = rootProject.file('local.properties')
if (propertiesFile.exists()) {
    propertiesFile.withInputStream { local.load(it) }
}
def apiId = local.getProperty('telegram.apiId', '0').trim()
def apiHash = local.getProperty('telegram.apiHash', '').trim()
if (!(apiId ==~ /0|[1-9][0-9]{0,9}/) || apiId.toLong() > Integer.MAX_VALUE ||
        !(apiHash ==~ /(?:[0-9a-fA-F]{32})?/)) {
    throw new GradleException('Check telegram.apiId and telegram.apiHash in local.properties.')
}

android {
    namespace 'com.tprlab.teletube'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tprlab.teletube'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'int', 'TELEGRAM_API_ID', apiId
        buildConfigField 'String', 'TELEGRAM_API_HASH', '"' + apiHash + '"'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'io.github.tdlib-android:core:0.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
